name: Build DG 6.0.3 Production
on:
  push:
    branches: ['main']
    paths:
      - 'app-5.0.js'
      - 'app-6.0-runtime.js'
      - 'app-6.0-ui.js'
      - 'app-6.0.1-fix.js'
      - 'app-6.0.2-reminders.js'
      - 'app-6.0.3-backend.js'
      - 'app-6.0.3-final.js'
      - 'app-6.0.3-reminder-notes.js'
      - '.github/workflows/build-v3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single 6.0.3 browser bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'app-5.0.js',
              'app-6.0-runtime.js',
              'app-6.0.3-backend.js',
              'app-6.0-ui.js',
              'app-6.0.1-fix.js',
              'app-6.0.2-reminders.js',
              'app-6.0.3-final.js',
              'app-6.0.3-reminder-notes.js',
          ]
          old_url = 'https://script.google.com/macros/s/AKfycbyFHSno-zZJetrAsH00fybiuxYw8xfYVo0kkWxhYLHNxDK4fqn5yijJfokrMvG6C4oc/exec'
          new_url = 'https://script.google.com/macros/s/AKfycby2L3SMgh2RoGWsNRUp6o11g4iyZ8bgkSIGaAZPnBXCkJTkDDGF9aydn9vVKMB7kXsO/exec'
          chunks = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing source: {name}')
              text = p.read_text(encoding='utf-8').replace(old_url, new_url)
              if name == 'app-6.0-runtime.js':
                  text = text.replace("const V='6.0',VIEW=", "const V='6.0.3',VIEW=", 1)
              elif name == 'app-6.0-ui.js':
                  text = text.replace("const V60='6.0.1';", "const V60='6.0.3';", 1)
              elif name in ('app-6.0.1-fix.js','app-6.0.2-reminders.js'):
                  text = text.replace("const V='6.0.1';", "const V='6.0.3';", 1)
                  text = text.replace("const V='6.0.2';", "const V='6.0.3';", 1)
              chunks.append(f'/* ===== SOURCE: {name} ===== */\n{text.rstrip()}\n;')
          out = '\n\n'.join(chunks) + '\n'
          forbidden = [
              old_url,
              'app-6.0-backend-compat.js',
              "const V='6.0',VIEW=",
              "const V60='6.0.1';",
              "const V='6.0.2';",
          ]
          for needle in forbidden:
              if needle in out:
                  raise SystemExit('Forbidden legacy value in production bundle: '+needle)
          if new_url not in out:
              raise SystemExit('Current Apps Script URL missing from production bundle')
          if 'saveOwnReminderInternalNote' not in out or 'd3OwnReminderNote' not in out:
              raise SystemExit('Reminder note feature missing from production bundle')
          Path('app-6.0.3.js').write_text(out, encoding='utf-8')
          PY
          node --check app-6.0.3.js
          test "$(grep -c 'AKfycby2L3SMgh2RoGWsNRUp6o11g4iyZ8bgkSIGaAZPnBXCkJTkDDGF9aydn9vVKMB7kXsO' app-6.0.3.js)" -ge 1
          ! grep -q 'AKfycbyFHSno-zZJetrAsH00fybiuxYw8xfYVo0kkWxhYLHNxDK4fqn5yijJfokrMvG6C4oc' app-6.0.3.js
      - name: Commit verified 6.0.3 bundle
        run: |
          git config user.name 'DG Build'
          git config user.email 'build@users.noreply.github.com'
          git add app-6.0.3.js
          git commit -m 'v6.0.3: verified single production bundle' || true
          git push origin HEAD:${GITHUB_REF_NAME}

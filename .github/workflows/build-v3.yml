name: Build DG 5.1.1
on:
  push:
    branches: ['release/v5.0-final','release/v5.0.1-maintenance-files','release/v5.0.2-signature-stability','release/v5.0.3-customer-correction','release/v5.0.4-object-address-toggle','release/v5.0.5-manual-maintenance-count','release/v5.1-performance']
    paths: ['build3/**', '.github/workflows/build-v3.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify DG 5.1.1
        run: |
          python -m pip install beautifulsoup4
          rm -rf build3/release
          mkdir -p build3/release
          python build3/build_frontend_50.py
          node --check build3/release/app-5.0.js
          node --check build3/release/sw.js
          python build3/verify_build_50.py
      - name: Commit verified 5.1.1 frontend on current release branch
        run: |
          git config user.name 'DG Build'
          git config user.email 'build@users.noreply.github.com'
          cp build3/release/index.html build3/release/app-5.0.js build3/release/app-5.0.css build3/release/sw.js build3/release/manifest.json .
          git add index.html app-5.0.js app-5.0.css sw.js manifest.json
          git commit -m 'v5.1.1: geprüfte dauerhafte Geräte-Anmeldung bereitstellen' || true
          git push origin HEAD:${GITHUB_REF_NAME}

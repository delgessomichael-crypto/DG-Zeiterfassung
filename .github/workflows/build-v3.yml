name: Validate DG 7.4.2 Clean Production
on:
  push:
    branches: ['main']
    paths:
      - 'app-7.4.2.js'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/build-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate single clean runtime
        run: |
          node --check app-7.4.2.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          app=Path('app-7.4.2.js').read_text(encoding='utf-8')
          refs=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']*app-[^"\']+\.js[^"\']*)["\']',html,re.I)
          if refs != ['./app-7.4.2.js?v=20260918-742-clean2']:
              raise SystemExit('index.html must load only current 7.4.2 runtime: '+repr(refs))
          forbidden=[
              'DG Zeiterfassung 5.2.1 - Büro UX',
              'DG Zeiterfassung 5.2.4 - jede Auffaelligkeit',
              'DG Zeiterfassung 5.2.5 - Performance',
              'new MutationObserver(',
              'serviceWorker.register(',
              'CONSOLIDATED SOURCE: app-7.3-payroll.js',
              'CONSOLIDATED SOURCE: app-7.3.6-force-payroll.js',
              'CONSOLIDATED SOURCE: app-7.3.7-payroll-final.js'
          ]
          bad=[x for x in forbidden if x in app]
          if bad: raise SystemExit('legacy runtime content found: '+repr(bad))
          required=[
              'dg70ShoppingOpen','dg72InspectionVisit','d3OfferDecision',
              'loadAvailability733','refreshAbsence734','dg735Healthy',
              'paintDue','completePayroll','captureDayOpen',
              'Alles überprüft – trotzdem an Steuerberater übergeben'
          ]
          missing=[x for x in required if x not in app]
          if missing: raise SystemExit('required current features missing: '+repr(missing))
          if 'DG Zeiterfassung 7.4.2' not in html:
              raise SystemExit('index version is not 7.4.2')
          sw=Path('sw.js').read_text(encoding='utf-8')
          if 'retirement service worker' not in sw or 'caches.delete' not in sw:
              raise SystemExit('retirement service worker missing')
          print('DG 7.4.2 clean runtime validated')
          PY

name: Build DG 7.3.1 Production
on:
  push:
    branches: ['main']
    paths:
      - 'app-5.0.js'
      - 'app-6.0-runtime.js'
      - 'app-6.0-ui.js'
      - 'app-6.0.1-fix.js'
      - 'app-6.0.2-reminders.js'
      - 'app-6.0.3-backend.js'
      - 'app-6.0.3-final.js'
      - 'app-6.0.3-reminder-notes.js'
      - 'app-7.0-shopping.js'
      - 'app-7.2-fixes.js'
      - 'app-7.2.1-offer-flow.js'
      - 'app-7.3-payroll.js'
      - 'app-7.3.1-fixes.js'
      - '.github/workflows/build-v3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build one verified DG 7.3.1 browser bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          VERSION='7.3.1'
          BUILD='20260918-731-r1'
          OLD_URL='https://script.google.com/macros/s/AKfycbyFHSno-zZJetrAsH00fybiuxYw8xfYVo0kkWxhYLHNxDK4fqn5yijJfokrMvG6C4oc/exec'
          BACKEND_URL='https://script.google.com/macros/s/AKfycby2L3SMgh2RoGWsNRUp6o11g4iyZ8bgkSIGaAZPnBXCkJTkDDGF9aydn9vVKMB7kXsO/exec'
          sources=[
              'app-5.0.js',
              'app-6.0-runtime.js',
              'app-6.0.3-backend.js',
              'app-6.0-ui.js',
              'app-6.0.1-fix.js',
              'app-6.0.2-reminders.js',
              'app-6.0.3-final.js',
              'app-6.0.3-reminder-notes.js',
              'app-7.0-shopping.js',
              'app-7.2-fixes.js',
              'app-7.2.1-offer-flow.js',
              'app-7.3-payroll.js',
              'app-7.3.1-fixes.js',
          ]

          chunks=[]
          release_guard=r'''/* DG 7.3.1 FINAL - einheitlicher sichtbarer Versionsstand */
          (function(){
          'use strict';
          const V='7.3.1';
          function stamp(){
            if(document.title!=='DG Zeiterfassung '+V)document.title='DG Zeiterfassung '+V;
            document.querySelectorAll('.login-card .muted.small').forEach(x=>{if(/^Version\s+/i.test((x.textContent||'').trim())&&x.textContent!=='Version '+V)x.textContent='Version '+V;});
            document.querySelectorAll('.hero strong').forEach(x=>{if(/Zeiterfassung/i.test(x.textContent||'')&&x.textContent!=='Zeiterfassung - '+V)x.textContent='Zeiterfassung - '+V;});
            try{window.DG_APP_VERSION=V;window.DG_RELEASE=V;if(window.DG3)DG3.version=V;}catch(_e){}
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',stamp,{once:true});else stamp();
          })();'''
          chunks.append(release_guard)

          for name in sources:
              p=Path(name)
              if not p.exists(): raise SystemExit('Missing source: '+name)
              text=p.read_text(encoding='utf-8')
              text=text.replace(OLD_URL,BACKEND_URL)
              # Nur der Produktionsbundle bekommt den neuen Stand. Historische Quelldateien bleiben als Bauquellen erhalten.
              for old in ('6.0.3','6.0.2','6.0.1','6.0'):
                  text=text.replace(old,VERSION)
              text=text.replace("KEY='dg603_backend'","KEY='dg70_backend'")
              chunks.append('/* ===== CONSOLIDATED SOURCE: '+name+' ===== */\n'+text.rstrip()+'\n;')

          bundle='\n\n'.join(chunks)+'\n'
          forbidden=[OLD_URL,'app-6.0-backend-compat.js',"const V='6.0'", "const V='6.0.1'", "const V='6.0.2'", "const V='6.0.3'"]
          for needle in forbidden:
              if needle in bundle: raise SystemExit('Legacy production value still present: '+needle)
          required=[BACKEND_URL,'saveOwnReminderInternalNote','d3OwnReminderNote','dg70ShoppingOpen','dg72InspectionVisit','d3OfferDecision','dg731CompletePayroll',"const V='7.3.1'"]
          for needle in required:
              if needle not in bundle: raise SystemExit('Required DG 7.3.1 feature missing: '+needle)
          if 'new MutationObserver(stamp)' in bundle:
              raise SystemExit('Unsafe recursive release observer detected')
          Path('app-7.3.1.js').write_text(bundle,encoding='utf-8')

          # index.html: nur EIN produktives App-Script laden.
          ip=Path('index.html');html=ip.read_text(encoding='utf-8')
          html=re.sub(r'DG Zeiterfassung\s+\d+(?:\.\d+)*','DG Zeiterfassung '+VERSION,html)
          html=re.sub(r'Version\s+\d+(?:\.\d+)*','Version '+VERSION,html)
          html=re.sub(r'Zeiterfassung\s*-\s*\d+(?:\.\d+)*','Zeiterfassung - '+VERSION,html)
          html=re.sub(r'<script\b[^>]*\bsrc=["\'][^"\']*app-[^"\']+\.js[^"\']*["\'][^>]*>\s*</script>','',html,flags=re.I)
          html=re.sub(r'app-5\.0\.css\?v=[^"\']+','app-5.0.css?v='+BUILD,html)
          html=re.sub(r'sw\.js\?v=[^"\']+','sw.js?v='+BUILD,html)
          html=html.replace('</body>','<script defer src="./app-7.3.1.js?v='+BUILD+'"></script></body>')
          if len(re.findall(r'<script\b[^>]*\bsrc=["\'][^"\']*app-[^"\']+\.js',html,re.I))!=1:
              raise SystemExit('index.html must load exactly one external app JS')
          if 'app-7.3.1.js?v='+BUILD not in html: raise SystemExit('DG 7.3.1 script missing in index')
          ip.write_text(html,encoding='utf-8')

          manifest={
            'id':'/DG-Zeiterfassung/','name':'DG Zeiterfassung 7.3.1','short_name':'DG 7.3.1',
            'description':'Mobile Zeiterfassung und Büro-App für Del Gesso Gebäudetechnik',
            'start_url':'./','scope':'./','display':'standalone','display_override':['standalone','minimal-ui'],
            'background_color':'#f3f4f6','theme_color':'#111827','prefer_related_applications':False,
            'icons':[{'src':'./dg_icon_192.png','sizes':'192x192','type':'image/png','purpose':'any'},
                     {'src':'./dg_icon_512.png','sizes':'512x512','type':'image/png','purpose':'any'}]
          }
          Path('manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sw=f'''const CACHE_NAME='dg-zeiterfassung-7-3-1-{BUILD}';\nconst APP='./app-7.3.1.js?v={BUILD}';\nconst CSS='./app-5.0.css?v={BUILD}';\nconst APP_SHELL=['./','./index.html',APP,CSS,'./manifest.json','./dg_icon_192.png','./dg_icon_512.png'];\nself.addEventListener('install',e=>e.waitUntil((async()=>{{const c=await caches.open(CACHE_NAME);await c.addAll(APP_SHELL);await self.skipWaiting();}})()));\nself.addEventListener('activate',e=>e.waitUntil((async()=>{{await Promise.all((await caches.keys()).filter(k=>k.startsWith('dg-zeiterfassung-')&&k!==CACHE_NAME).map(k=>caches.delete(k)));await self.clients.claim();}})()));\nself.addEventListener('fetch',e=>{{const u=new URL(e.request.url),base=new URL('./',self.location.href);if(e.request.method!=='GET'||u.origin!==base.origin||!u.pathname.startsWith(base.pathname))return;if(e.request.mode==='navigate'){{e.respondWith((async()=>{{try{{const r=await fetch(e.request,{{cache:'no-store'}});if(r.ok){{const c=await caches.open(CACHE_NAME);await c.put(new URL('./index.html',base).href,r.clone());}}return r;}}catch(_e){{const c=await caches.open(CACHE_NAME);return await c.match(new URL('./index.html',base).href)||await c.match(new URL('./',base).href)||Response.error();}}}})());return;}}if(!APP_SHELL.some(p=>new URL(p,base).href===u.href))return;e.respondWith((async()=>{{const c=await caches.open(CACHE_NAME),hit=await c.match(e.request);if(hit)return hit;const r=await fetch(e.request,{{cache:'no-store'}});if(r.ok)await c.put(e.request,r.clone());return r;}})());}});\n'''
          Path('sw.js').write_text(sw,encoding='utf-8')
          PY
          node --check app-7.3.1.js
          node --check sw.js
          test "$(grep -Eo '<script[^>]+src=["'"'][^"'"']*app-[^"'"']+\.js' index.html | wc -l)" -eq 1
          grep -q 'app-7.3.1.js' index.html
          grep -q 'DG Zeiterfassung 7.3.1' manifest.json
          ! grep -q 'app-6.0-backend-compat.js' app-7.3.1.js
          ! grep -q 'new MutationObserver(stamp)' app-7.3.1.js
      - name: Publish final DG 7.3.1 files
        run: |
          git config user.name 'DG Build'
          git config user.email 'build@users.noreply.github.com'
          git rm -f --ignore-unmatch app-6.0.3.js app-6.0-backend-compat.js
          git add app-7.3.1.js index.html sw.js manifest.json
          git commit -m 'v7.3.1: Lohnabschluss UI und Aushilfenlogik' || true
          git push origin HEAD:${GITHUB_REF_NAME}

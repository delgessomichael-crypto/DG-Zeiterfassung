<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="dg_icon_192.png">
  <link rel="apple-touch-icon" href="dg_icon_192.png">
  <title>DG Zeiterfassung</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
    main{max-width:560px;margin:auto;padding:20px}
    .card{margin-top:12vh;background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    img{display:block;width:82%;max-width:340px;margin:0 auto 20px}
    h1{text-align:center;font-size:24px}
    p{line-height:1.5}
    .status{padding:12px;border-radius:12px;font-weight:700;margin:14px 0}
    .online{background:#dcfce7;color:#166534}
    .offline{background:#ffedd5;color:#9a3412}
    .note{font-size:14px;color:#6b7280}
  </style>
</head>
<body>
<main>
  <div class="card">
    <img src="dg_icon_512.png" alt="Del Gesso">
    <h1>DG Zeiterfassung</h1>
    <div id="status" class="status"></div>
    <p>Die installierbare PWA-Hülle ist eingerichtet und kann auch ohne Internet gestartet werden.</p>
    <p class="note">Nächster Schritt: Die bestehende Zeiterfassungsmaske und die Offline-Warteschlange werden in diese PWA übernommen und mit dem Büro-Backend synchronisiert.</p>
  </div>
</main>
<script>
  function updateStatus(){
    const el=document.getElementById('status');
    if(navigator.onLine){
      el.className='status online';
      el.textContent='🟢 Online';
    }else{
      el.className='status offline';
      el.textContent='🟠 Offline – App bleibt verfügbar';
    }
  }
  window.addEventListener('online',updateStatus);
  window.addEventListener('offline',updateStatus);
  updateStatus();

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
